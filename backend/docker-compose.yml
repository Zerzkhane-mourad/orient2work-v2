services:
  postgres:
    image: postgres:16-alpine
    container_name: orient2work-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orient2work
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: orient2work
    ports:
      - "5432:5432"
    volumes:
      - orient2work-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orient2work -d orient2work"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orient2work-pgdata:
